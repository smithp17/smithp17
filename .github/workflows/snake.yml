name: Update profile graphics

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Draw stat cards
        run: python3 scripts/stats.py ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#F472B6&color_dots=#ebedf0,#c7f5fb,#8be9f7,#22D3EE,#A78BFA
            dist/snake-dark.svg?palette=github-dark&color_snake=#F472B6&color_dots=#161b22,#123047,#155e75,#22D3EE,#A78BFA

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
