name: 🐍 Feed the snake

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  workflow_dispatch:           # run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#FF6B6B&color_dots=#ebedf0,#c8f2ef,#8fe3dc,#4ECDC4,#2a9d8f
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF6B6B&color_dots=#161b22,#1d3b39,#2a6f69,#3aa89f,#4ECDC4

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
