<style>
 .bob { animation: bob 2.4s ease-in-out infinite; } @keyframes bob { 50% { transform: translateY(-3px) } }
 .eye { animation: e 4s steps(1) infinite; } @keyframes e { 0%,93% { opacity:1 } 94%,97% { opacity:0 } }
 .fl { animation: fl 4s ease-in infinite; opacity:0; font-family: Consolas,'Courier New',monospace; font-weight:700; }
 @keyframes fl { 0% { opacity:0; transform: translateY(0) } 20% { opacity:1 } 100% { opacity:0; transform: translateY(-70px) } }
 .st { animation: st 2.5s ease-in-out infinite; opacity:.0 } @keyframes st { 0% { opacity:0; transform: translateY(4px) } 40% { opacity:.7 } 100% { opacity:0; transform: translateY(-14px) } }
 .glow { animation: g 1.8s ease-in-out infinite; } @keyframes g { 50% { opacity:.55 } }
</style>
