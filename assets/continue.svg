<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Continue? Countdown. Player 2, insert coin: send an email.">
<style>.blink { animation: b 0.8s steps(1) infinite; } @keyframes b { 50% { opacity: 0 } }</style>
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".25"/></pattern>
<filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="1" y="1" width="998" height="208" rx="18" fill="#0B0B14" stroke="#FF6B6B" stroke-opacity=".5" stroke-width="2"/>
