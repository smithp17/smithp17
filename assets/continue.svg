<g><animate attributeName="opacity" values="1;0" keyTimes="0;0.7692" calcMode="discrete" dur="13s" repeatCount="indefinite"/><text x="500" y="78" font-size="34" fill="#fff" letter-spacing="8">CONTINUE?</text>
