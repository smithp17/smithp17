<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="GitHub overview">
<style>
 .in{animation:in .8s cubic-bezier(.16,1,.3,1) both} @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
 .pulse{animation:p 1.8s ease-in-out infinite} @keyframes p{50%{opacity:.3}}
</style>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient>
 <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 
</defs>
<g class="in" style="animation-delay:0.0s"><rect x="10" y="5" width="230" height="140" rx="18" fill="url(#bg)"/><rect x="10.75" y="5.75" width="228.5" height="138.5" rx="17.5" fill="none" stroke="#334155" stroke-opacity=".8" stroke-width="1.5"/>
<circle class="pulse" cx="38" cy="38" r="4.5" fill="#22D3EE" filter="url(#glow)"/>
<text x="52" y="43" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Contributions</text>
<text x="34" y="96" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="40" font-weight="800" fill="#E2E8F0">122</text>
<text x="34" y="122" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11.5" fill="#22D3EE">last 12 months</text></g>
<g class="in" style="animation-delay:0.1s"><rect x="260" y="5" width="230" height="140" rx="18" fill="url(#bg)"/><rect x="260.75" y="5.75" width="228.5" height="138.5" rx="17.5" fill="none" stroke="#334155" stroke-opacity=".8" stroke-width="1.5"/>
<circle class="pulse" cx="288" cy="38" r="4.5" fill="#F472B6" filter="url(#glow)"/>
<text x="302" y="43" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Current streak</text>
<text x="284" y="96" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="40" font-weight="800" fill="#E2E8F0">0<tspan font-size="16" font-weight="600" fill="#94A3B8"> days</tspan></text>
<text x="284" y="122" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11.5" fill="#F472B6">best: 4 days</text></g>
<g class="in" style="animation-delay:0.2s"><rect x="510" y="5" width="230" height="140" rx="18" fill="url(#bg)"/><rect x="510.75" y="5.75" width="228.5" height="138.5" rx="17.5" fill="none" stroke="#334155" stroke-opacity=".8" stroke-width="1.5"/>
<circle class="pulse" cx="538" cy="38" r="4.5" fill="#A78BFA" filter="url(#glow)"/>
<text x="552" y="43" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Commits</text>
<text x="534" y="96" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="40" font-weight="800" fill="#E2E8F0">108</text>
<text x="534" y="122" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11.5" fill="#A78BFA">last 12 months</text></g>
<g class="in" style="animation-delay:0.3s"><rect x="760" y="5" width="230" height="140" rx="18" fill="url(#bg)"/><rect x="760.75" y="5.75" width="228.5" height="138.5" rx="17.5" fill="none" stroke="#334155" stroke-opacity=".8" stroke-width="1.5"/>
<circle class="pulse" cx="788" cy="38" r="4.5" fill="#34D399" filter="url(#glow)"/>
<text x="802" y="43" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Repositories</text>
<text x="784" y="96" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="40" font-weight="800" fill="#E2E8F0">36</text>
<text x="784" y="122" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11.5" fill="#34D399">7 pull requests</text></g>
</svg>